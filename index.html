<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f8fc">
<title>完成三连，获取资源</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:24px 16px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#eef5ff,#f8faff 52%,#f2f6fb);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#263445}
.wrap{width:min(100%,460px)}
.top{text-align:center;margin-bottom:18px}
.mark{width:58px;height:58px;border-radius:18px;background:#1677e8;color:#fff;display:grid;place-items:center;margin:0 auto 13px;font-size:28px;box-shadow:0 8px 22px #1677e833}
.top small{font-size:11px;letter-spacing:2px;color:#7890ad}
.card{background:#fff;border:1px solid #e5edf7;border-radius:18px;padding:27px 24px 23px;box-shadow:0 16px 48px #24466b12}
h1{font-size:24px;line-height:1.35;text-align:center;margin:0 0 10px;color:#1d2d42}
.intro{text-align:center;font-size:14px;line-height:1.8;color:#738196;margin:0 0 23px}
.steps{display:grid;gap:11px;margin-bottom:20px}
.step{display:flex;align-items:center;gap:14px;padding:13px 14px;border:1px solid #e8eef6;border-radius:12px;background:#fbfdff}
.icon{width:42px;height:42px;flex:0 0 42px;border-radius:12px;background:#edf5ff;display:grid;place-items:center;font-size:22px}
.step b{display:block;font-size:15px;color:#26384e;margin-bottom:3px}
.step span{font-size:12px;color:#8492a5}
.num{margin-left:auto;color:#a4b2c3;font-size:12px}
.tip{padding:12px 13px;border-radius:10px;background:#f2f7ff;color:#607b9c;font-size:12px;line-height:1.7;margin-bottom:18px}
button,.resource{width:100%;height:49px;border:0;border-radius:11px;background:#1677e8;color:white;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;transition:.15s}
button:hover,.resource:hover{background:#0867d5}
button:active,.resource:active{transform:scale(.99)}
.hidden{display:none}
.success{margin:0 0 14px;padding:14px;border:1px solid #cfeedd;border-radius:11px;background:#f0fbf4;text-align:center;color:#27804b;font-size:14px;line-height:1.7}
.resource{background:#16a05a;margin-top:10px}
.resource:hover{background:#11864b}
.foot{text-align:center;font-size:11px;line-height:1.8;color:#a0aaba;margin:16px 6px 0}
@media(max-width:380px){.card{padding:23px 17px}h1{font-size:22px}}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div class="mark">✓</div>
    <small>RESOURCE ACCESS GUIDE</small>
  </header>
  <section class="card">
    <h1>完成视频三连，获取资源</h1>
    <p class="intro">感谢支持！请回到你刚刚观看的 B 站视频，完成以下三个操作。</p>
    <div class="steps">
      <div class="step"><div class="icon">👍</div><div><b>第一步：点赞</b><span>给当前视频点个赞</span></div><div class="num">01</div></div>
      <div class="step"><div class="icon">🪙</div><div><b>第二步：投币</b><span>为喜欢的内容投上硬币</span></div><div class="num">02</div></div>
      <div class="step"><div class="icon">⭐</div><div><b>第三步：收藏</b><span>将视频收藏，方便以后查看</span></div><div class="num">03</div></div>
    </div>
    <div class="tip">完成后请回到本页面，点击下方按钮确认。此链接为通用入口，不绑定某一个视频；请对发布此链接的评论所在视频完成三连。</div>
    <div id="before">
      <button id="confirm" type="button">我已完成三连，继续获取资源</button>
    </div>
    <div id="after" class="hidden">
      <div class="success">✓ 已收到你的完成确认！<br>感谢支持，点击下方按钮获取资源。</div>
      <a class="resource" href="https://pan.quark.cn/s/17e5fee55d12" target="_blank" rel="noopener noreferrer">打开夸克网盘获取资源</a>
    </div>
  </section>
  <footer class="foot">第三方资源引导页面，非 B 站官方页面。完成状态由访问者自行确认，本页面无法读取或验证 B 站的点赞、投币、收藏状态。</footer>
</main>
<script>
document.getElementById("confirm").addEventListener("click",function(){
  document.getElementById("before").classList.add("hidden");
  document.getElementById("after").classList.remove("hidden");
});
</script>
</body>
</html>
