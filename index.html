<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>资源入口确认</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px;background:linear-gradient(135deg,#edf3ff,#f8faff 52%,#eaf5ff);font-family:Arial,"Microsoft YaHei",sans-serif;color:#26364d}
.card{width:min(100%,430px);background:#fff;border:1px solid #e3eaf5;border-radius:13px;box-shadow:0 14px 42px #284b7718;overflow:hidden}
.head{height:5px;background:#2878ee}.inner{padding:28px 27px 23px;text-align:center}
.logo{font-size:12px;letter-spacing:2px;color:#7b8ba4;font-weight:700}
h1{font-size:24px;margin:15px 0 9px;color:#26364d}.desc{font-size:14px;line-height:1.8;color:#7a879a;margin:0 0 22px}
.state{display:flex;align-items:center;text-align:left;gap:13px;padding:16px;border-radius:9px;margin:0 0 18px;background:#fff7ee;border:1px solid #ffe5c6}
.state.ok{background:#effaf3;border-color:#d3efdc}.symbol{width:40px;height:40px;border-radius:50%;background:#ffead2;color:#d47b19;display:grid;place-items:center;font-size:23px;flex:none}.ok .symbol{background:#d9f3e1;color:#239b53}
.state b{font-size:15px;display:block;margin-bottom:5px}.state small{font-size:12px;color:#8995a5;line-height:1.5;display:block}
.tip{background:#f5f7fb;border-radius:8px;padding:13px 14px;text-align:left;font-size:12px;color:#7a8798;line-height:1.85;margin-bottom:19px}
.action{display:block;width:100%;border:0;border-radius:8px;padding:14px 10px;background:#3478e5;color:white;font-size:16px;font-weight:700;text-decoration:none;cursor:pointer}
.action:hover{background:#2869d1}.foot{font-size:11px;color:#a0aaba;line-height:1.7;margin:15px 0 0}
@media(max-width:460px){.inner{padding:24px 19px 20px}}
</style>
</head>
<body><main class="card"><div class="head"></div><section class="inner">
<div class="logo">RESOURCE ACCESS</div>
<h1>资源分享入口</h1>
<p class="desc">请按页面提示操作，进入资源分享页面。</p>
<div id="state" class="state"><div class="symbol">!</div><div><b>页面尚未刷新</b><small>请点击下方按钮刷新页面，更新入口状态</small></div></div>
<div class="tip">温馨提示：这是第三方资源引导页，不属于哔哩哔哩或夸克官方页面。本页面无法检测点赞、投币、收藏等互动状态，刷新仅更新本页面的入口显示状态。</div>
<div id="action"></div>
<p class="foot">请确认资源来源。点击开放后的按钮将前往夸克网盘分享页面。</p>
</section></main>
<script>
const key='quark_resource_page_refreshed';
const refreshed=sessionStorage.getItem(key)==='yes';
const state=document.getElementById('state');
const action=document.getElementById('action');
if(refreshed){
 state.className='state ok';
 state.innerHTML='<div class="symbol">✓</div><div><b>资源入口已开放</b><small>页面状态已更新，可以前往查看分享内容</small></div>';
 action.innerHTML='<a class="action" href="https://pan.quark.cn/s/17e5fee55d12" target="_blank" rel="noopener noreferrer">前往夸克网盘　→</a>';
}else{
 action.innerHTML='<button class="action" id="refresh">刷新页面</button>';
 document.getElementById('refresh').addEventListener('click',()=>{sessionStorage.setItem(key,'yes');location.reload()});
}
</script>
</body></html>
