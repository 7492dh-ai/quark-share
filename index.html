<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f7fb">
<title>完整版资源入口</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:24px;display:flex;align-items:center;justify-content:center;background:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#222}
.card{width:min(100%,430px);background:#fff;border:1px solid #e8edf3;border-radius:14px;box-shadow:0 10px 36px rgba(31,45,61,.08);padding:30px 28px 24px;text-align:center}
.logo{width:54px;height:54px;margin:0 auto 15px;border-radius:50%;background:#eaf3ff;color:#1684e8;display:grid;place-items:center;font-size:27px}
.eyebrow{font-size:11px;letter-spacing:1.7px;color:#8a98a8}
h1{font-size:23px;margin:12px 0 9px;font-weight:700;color:#242a32}
.desc{font-size:13px;color:#788493;line-height:1.8;margin:0 auto 20px}
.result{display:flex;gap:12px;align-items:center;text-align:left;padding:15px 15px;border-radius:9px;background:#fff7f2;border:1px solid #ffe6d8;margin-bottom:15px}
.result.good{background:#f0f9f3;border-color:#d7efdf}
.badgeicon{width:36px;height:36px;flex:none;border-radius:50%;display:grid;place-items:center;background:#ffe8dd;color:#e16b3d;font-size:19px;font-weight:700}
.good .badgeicon{background:#dcf3e3;color:#259957}
.result strong{display:block;font-size:14px;color:#343d49;margin-bottom:4px}
.result small{display:block;color:#84909d;font-size:11px;line-height:1.6}
.tip{background:#f6f8fa;border-radius:8px;padding:12px 13px;text-align:left;color:#7c8794;font-size:11px;line-height:1.8;margin-bottom:18px}
button,.go{width:100%;height:46px;border:0;border-radius:7px;background:#1684e8;color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer}
button:hover,.go:hover{background:#0876d8}
.foot{font-size:10px;color:#a0aab5;line-height:1.7;margin:14px 0 0}
@media(max-width:480px){.card{padding:25px 19px 20px}}
</style>
</head>
<body>
<main class="card">
<div class="logo">↻</div>
<div class="eyebrow">RESOURCE SHARE PAGE</div>
<h1>完整版资源入口</h1>
<p class="desc">请查看下方页面提示，更新入口状态后即可前往网盘。</p>
<div id="result" class="result">
<div class="badgeicon">!</div>
<div><strong>入口状态尚未更新</strong><small>请点击下方按钮刷新页面，更新入口状态</small></div>
</div>
<div class="tip">页面说明：本页面为第三方资源分享引导页，并非哔哩哔哩或夸克官方页面。此处的状态仅用于页面流程展示，不会检测或验证账号是否完成点赞、投币、收藏等操作。</div>
<div id="action"><button id="refresh" type="button">刷新页面</button></div>
<p class="foot">确认资源来源后再继续。打开按钮将跳转至夸克网盘分享页面。</p>
</main>
<script>
const stateKey="quark_entry_state_v3";
if(sessionStorage.getItem(stateKey)==="updated"){
 document.getElementById("result").className="result good";
 document.getElementById("result").innerHTML='<div class="badgeicon">✓</div><div><strong>入口状态已更新</strong><small>现在可以继续前往网盘查看分享内容</small></div>';
 document.getElementById("action").innerHTML='<a class="go" href="https://pan.quark.cn/s/17e5fee55d12" target="_blank" rel="noopener noreferrer">前往夸克网盘　›</a>';
}
const refresh=document.getElementById("refresh");
if(refresh)refresh.addEventListener("click",()=>{sessionStorage.setItem(stateKey,"updated");location.reload()});
</script>
</body>
</html>
