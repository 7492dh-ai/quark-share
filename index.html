<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f7ff">
<title>资源入口确认</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:22px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#eef3ff 0%,#f8faff 52%,#e9f4ff 100%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#26364d}
.card{width:min(100%,410px);padding:29px 25px 23px;background:#fff;border:1px solid #e5ebf4;border-radius:17px;box-shadow:0 16px 48px rgba(40,75,125,.12);text-align:center}
.icon{width:56px;height:56px;margin:0 auto 17px;border-radius:16px;background:#edf3ff;color:#3478e5;display:grid;place-items:center;font-size:29px}
.eyebrow{font-size:11px;letter-spacing:2px;color:#8795aa}
h1{font-size:24px;margin:10px 0 10px;font-weight:700;color:#202f46}
.desc{font-size:13px;line-height:1.85;color:#78869b;margin:0 auto 20px;max-width:320px}
.status{display:flex;align-items:center;gap:12px;text-align:left;padding:14px 15px;border-radius:10px;background:#f4f7fc;border:1px solid #e9eef6;margin-bottom:16px}
.statusmark{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;background:#e5efff;color:#3478e5;font-size:19px;font-weight:700}
.status b{display:block;font-size:14px;margin-bottom:4px;color:#344761}
.status small{display:block;font-size:11px;line-height:1.6;color:#8794a7}
.note{padding:12px 13px;margin-bottom:18px;text-align:left;background:#f7f9fc;border-radius:9px;color:#7d899b;font-size:11px;line-height:1.8}
.action{display:block;width:100%;height:46px;border:0;border-radius:8px;background:#3477e5;color:#fff;font-size:15px;font-weight:700;text-decoration:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.action:hover{background:#2868d0}
.foot{font-size:10px;color:#a2adbc;line-height:1.7;margin:14px 0 0}
@media(max-width:440px){.card{padding:25px 19px 20px}}
</style>
</head>
<body>
<main class="card">
<div class="icon">↻</div>
<div class="eyebrow">RESOURCE ACCESS</div>
<h1>资源入口确认</h1>
<p class="desc">请根据页面提示完成入口确认，随后即可前往网盘查看分享内容。</p>
<div id="status" class="status"><div class="statusmark">!</div><div><b>入口尚未确认</b><small>点击下方按钮刷新页面，更新当前入口状态</small></div></div>
<div class="note">说明：这是第三方资源分享引导页，不属于哔哩哔哩或夸克官方页面。刷新只会更新本页面的显示状态，不会检测或验证点赞、投币、收藏等平台互动行为。</div>
<div id="action"><button class="action" id="refresh" type="button">刷新页面</button></div>
<p class="foot">确认资源来源后再继续。下一步将打开夸克网盘分享页面。</p>
</main>
<script>
const flag="quark_entry_confirmed_v2";
if(sessionStorage.getItem(flag)==="yes"){
 document.getElementById("status").innerHTML='<div class="statusmark">✓</div><div><b>入口已准备好</b><small>页面状态已更新，可以前往查看分享内容</small></div>';
 document.getElementById("action").innerHTML='<a class="action" href="https://pan.quark.cn/s/17e5fee55d12" target="_blank" rel="noopener noreferrer">前往夸克网盘　→</a>';
}
document.getElementById("refresh")?.addEventListener("click",()=>{sessionStorage.setItem(flag,"yes");location.reload()});
</script>
</body>
</html>
